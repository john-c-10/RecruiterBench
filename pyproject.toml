[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wrangle-recruiting-bench"
version = "1.0.0"
description = "A frozen-role, two-stage people-search benchmark"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5", "certifi>=2024.8.30"]

[project.scripts]
recruiting-bench = "benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.setuptools.package-data]
benchmark = ["prompts/*.txt", "schemas/*.json"]
